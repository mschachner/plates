# Deploys Plates to mark-schachner.com/plates on every push to main,
# following the pattern in the site repo's DEPLOYING.md (plain static
# project: no build step; only the files the browser fetches are copied).
#
# One-time setup (see DEPLOYING.md §2): a deploy key on mschachner/site
# with write access, and its private half in this repo's Actions secret
# SITE_DEPLOY_KEY.
name: Deploy to site
on:
  push:
    branches: [main]

# Rapid consecutive pushes race each other on the site-repo push; queue them
# and keep only the newest (it deploys the same latest commit anyway).
concurrency:
  group: deploy-to-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to site repo
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$DEPLOY_KEY"
          git clone --depth 1 git@github.com:mschachner/site.git site
          rm -rf site/plates
          mkdir -p site/plates
          cp index.html styles.css game.js data.js candidates.js site/plates/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plates
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy plates from ${GITHUB_SHA::7}"
          # Another repo's deploy may land between our clone and push;
          # rebase our single commit onto whatever arrived and retry.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
